# =============================================================================
#  R E P S   ·   fcgi-net
# =============================================================================
[package]
name    = "fcgi-net"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Sans-IO FastCGI engine for Rust: the responder role over FastCGI records, multiplexed requests, bounded buffers, and parameter parsing, so a Rust service can run behind Apache or nginx FastCGI. No dependencies."

# Keywords (5 max)
keywords = ["fastcgi", "fcgi", "cgi", "apache", "nginx"]

# Categories
categories = ["web-programming", "network-programming", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/fcgi-net"
repository    = "https://github.com/jamesgober/fcgi-net"
documentation = "https://docs.rs/fcgi-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "fcgi_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
